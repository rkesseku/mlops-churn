apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: churn-serving
  namespace: mlops-churn
  labels:
    app.kubernetes.io/name: churn-serving
    app.kubernetes.io/part-of: mlops-churn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: churn-serving
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
