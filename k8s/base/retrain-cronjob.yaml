apiVersion: batch/v1
kind: CronJob
metadata:
  name: churn-retrain
  namespace: mlops-churn
  labels:
    app.kubernetes.io/name: churn-retrain
    app.kubernetes.io/part-of: mlops-churn
spec:
  schedule: "0 3 * * *"        # daily 03:00 (cluster time zone, usually UTC)
  concurrencyPolicy: Forbid     # never run two retrains at once
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: churn-retrain
            app.kubernetes.io/part-of: mlops-churn
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
            - name: retrain
              image: churn-retrain:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "-m", "churn_platform.retrain"]
              envFrom:
                - configMapRef:
                    name: churn-config
                - secretRef:
                    name: churn-secrets
                    optional: true
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: churn-data
