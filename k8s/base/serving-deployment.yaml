apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-serving
  namespace: mlops-churn
  labels:
    app.kubernetes.io/name: churn-serving
    app.kubernetes.io/part-of: mlops-churn
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: churn-serving
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: churn-serving
        app.kubernetes.io/part-of: mlops-churn
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: serving
          image: churn-serving:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: churn-config
            - secretRef:
                name: churn-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # The model is downloaded from MLflow at startup; allow up to ~2.5 min.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
