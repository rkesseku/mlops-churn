# Docker Compose stack for the MLOps churn platform.
# Phase 2: Postgres + MinIO + MLflow.
# Later phases will add: Spark, FastAPI serving, Prometheus, Grafana.

services:
  # ------------------------------------------------------------------
  # Postgres — backs MLflow's experiment metadata store.
  # Stores: runs, params, metrics, model registry rows.
  # Not exposed publicly in production; only MLflow needs to reach it.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: churn-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # MinIO — S3-compatible object storage for model artifacts.
  # MLflow uploads trained models, plots, etc. here.
  # Web console on :9001, S3 API on :9000.
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: churn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API (what MLflow talks to)
      - "9001:9001"   # Web console (what you open in the browser)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # MinIO init — one-shot container that creates the buckets we need
  # on first boot. Without buckets, MLflow's first artifact upload fails.
  # `mc` is MinIO's official CLI.
  # ------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: churn-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      mc mb --ignore-existing local/raw-data &&
      mc mb --ignore-existing local/features &&
      echo 'Buckets ready.'
      "

  # ------------------------------------------------------------------
  # MLflow — tracking server + model registry.
  # Connects to Postgres for metadata, MinIO for artifacts.
  # UI on :5000.
  # ------------------------------------------------------------------
  mlflow:
    build:
      context: ./docker/mlflow
    container_name: churn-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # MLflow uses boto3 under the hood to talk to MinIO. The boto3
      # client reads these env vars — they're the standard AWS names,
      # which is why MinIO works as a drop-in S3 replacement.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"

# Named volumes — Docker manages where these actually live on disk.
# They survive `docker compose down` so your data isn't lost.
# To wipe everything: `docker compose down -v` (the -v deletes volumes).
volumes:
  postgres-data:
  minio-data:
