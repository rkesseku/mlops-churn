# Docker Compose stack for the MLOps churn platform.
# Phase 2: Postgres + MinIO + MLflow.
# Phase 4: + Spark.
# Later phases: + FastAPI serving, Prometheus, Grafana.

services:
  # ------------------------------------------------------------------
  # Postgres — backs MLflow's experiment metadata store.
  # ------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: churn-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # MinIO — S3-compatible object storage.
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: churn-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # MinIO init — creates the buckets we need on first boot.
  # ------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: churn-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/mlflow-artifacts &&
      mc mb --ignore-existing local/raw-data &&
      mc mb --ignore-existing local/features &&
      echo 'Buckets ready.'
      "

  # ------------------------------------------------------------------
  # MLflow — tracking server + model registry.
  # ------------------------------------------------------------------
  mlflow:
    build:
      context: ./docker/mlflow
    container_name: churn-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    command: >
      mlflow server
      --backend-store-uri postgresql://mlflow:mlflow@postgres:5432/mlflow
      --default-artifact-root s3://mlflow-artifacts/
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"

  # ------------------------------------------------------------------
  # Spark — distributed data processing.
  # We use a custom image that bundles PySpark with S3A (Hadoop-AWS) jars
  # so the job can read/write to MinIO. The container also has our Python
  # code mounted in, so spark-submit can run scripts that import
  # `churn_platform.*` modules.
  #
  # This runs Spark in standalone *single-node* mode — driver and one
  # executor in the same container. For 1M rows that's correct; for a
  # real cluster, replace this with separate master/worker services.
  # ------------------------------------------------------------------
  spark:
    build:
      context: ./docker/spark
    container_name: churn-spark
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # Spark itself uses these to talk to MinIO via S3A.
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      # Memory caps so Spark doesn't try to eat all 32 GB.
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 4g
    volumes:
      # Mount the project source so spark-submit can find our code.
      # Read-only because the Spark job shouldn't be modifying our source.
      - ./src:/opt/jobs/src:ro
      # Mount the raw-data dir so we can `spark-submit` against local files
      # during development without round-tripping through MinIO.
      - ./data:/opt/jobs/data
    ports:
      - "8080:8080"   # Spark master UI
      - "4040:4040"   # Spark application UI (live during job runs)
    # Keep the container alive; we'll exec into it with `spark-submit`.
    command: tail -f /dev/null

volumes:
  postgres-data:
  minio-data:
