# Prometheus scrape configuration for the churn platform.
# Scrapes the FastAPI serving container's /metrics every 15 seconds.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "churn-serving"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["serving:8000"]
        labels:
          service: "churn-serving"
